{% extends "base.html" %}

{% block nav %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('admin.dashboard') }}">🔧 Ehtiyat hissələri · Admin</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="nav" class="collapse navbar-collapse">
      {% if current_user.is_authenticated %}
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.dashboard') }}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.store_list') }}">Mağazalar</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.brand_list') }}">Markalar</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('public.index') }}" target="_blank">İşçi tərəfi ↗</a></li>
        <li class="nav-item">
          <span class="nav-link text-white-50">{{ current_user.username }}</span>
        </li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.logout') }}">Çıxış</a></li>
      </ul>
      {% endif %}
    </div>
  </div>
</nav>
{% endblock %}
